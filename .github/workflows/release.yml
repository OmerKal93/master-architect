name: Release

# Publishes packages/agent-lint to PyPI via trusted publishing (OIDC) -- no stored API tokens.
#
# INERT UNTIL A HUMAN COMPLETES SETUP: trusted publishing requires configuring the trust
# relationship (owner/repo/workflow/environment) on pypi.org for the `agent-lint` project.
# See docs/release.md for the one-time setup steps. Until that's done, a pushed tag will run
# this workflow and the publish step will fail with an authorization error -- nothing is
# published silently, and nothing here can publish without that explicit PyPI-side step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        working-directory: packages/agent-lint
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-lint-dist
          path: packages/agent-lint/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (OIDC) -- no API token is stored
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-lint-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@4bb033805d9e19112d8c697528791ff53f6c2f74 # v1.9.0
