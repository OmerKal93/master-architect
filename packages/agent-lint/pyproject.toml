[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-lint"
version = "0.1.0"
description = "Local-first static analyzer for AI agent reliability and security anti-patterns."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Agent Reliability Toolkit Contributors" },
]
keywords = ["ai-agents", "static-analysis", "reliability", "security", "langgraph", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
agent-lint = "agent_reliability.lint.cli:main"

[project.urls]
Homepage = "https://github.com/OmerKal93/master-architect"
Issues = "https://github.com/OmerKal93/master-architect/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "jsonschema>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "jsonschema>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agent_reliability"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agent_reliability"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
